<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沈阳运中 · 授权客户 & 美云销商户分级看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1e3a5f,#2d6cb3);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.header .sub{font-size:12px;opacity:.8;margin-top:2px}
.tabs{display:flex;gap:0;background:#fff;padding:0 28px;border-bottom:1px solid #e0e0e0}
.tab{padding:14px 28px;font-size:14px;font-weight:500;color:#666;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;user-select:none}
.tab:hover{color:#2d6cb3;background:#f5f7fa}
.tab.active{color:#2d6cb3;border-bottom-color:#2d6cb3}
.tab .badge{display:inline-block;margin-left:6px;padding:1px 7px;font-size:11px;background:#e8f0fe;color:#2d6cb3;border-radius:10px;font-weight:600}
.tab.active .badge{background:#2d6cb3;color:#fff}
.iframe-wrap{position:relative;width:100%;height:calc(100vh - 110px);overflow:hidden}
.iframe-wrap iframe{width:100%;height:100%;border:none;display:none}
.iframe-wrap iframe.active{display:block}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>沈阳运中 · 授权客户 & 美云销商户分级看板</h1>
    <div class="sub">区域授权客户监控 ｜ 美云销商户分级动态分析</div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" data-target="frame1">区域授权客户监控看板<span class="badge">16城市</span></div>
  <div class="tab" data-target="frame2">美云销商户分级看板<span class="badge">1670户</span></div>
</div>
<div class="iframe-wrap">
  <iframe id="frame1" class="active" src="merchant-monitor.html"></iframe>
  <iframe id="frame2" src="grade_dashboard.html"></iframe>
</div>
<script>
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.iframe-wrap iframe').forEach(function(f){f.classList.remove('active')});
    t.classList.add('active');
    document.getElementById(t.dataset.target).classList.add('active');
  };
});
</script>
</body>
</html>
